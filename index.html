<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>美食调味计算器</title>
  <style>
    :root {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      color: #0f172a;
      background: #f1f5f9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: max(1.5rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(2.5rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      background: linear-gradient(180deg, #f8fafc, #e2e8f0);
      -webkit-font-smoothing: antialiased;
    }

    button,
    input {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .nav-tabs {
      display: flex;
      gap: 0.35rem;
      background: #e2e8f0;
      padding: 0.35rem;
      border-radius: 14px;
      width: 100%;
      max-width: 480px;
    }

    .nav-tab {
      border: none;
      background: transparent;
      padding: 0.6rem 0.75rem;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      white-space: nowrap;
      flex: 1;
    }

    .nav-tab:hover {
      color: #0f172a;
    }

    .nav-tab.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    .card {
      background: #fff;
      padding: 1.5rem;
      border-radius: 18px;
      box-shadow: 0 12px 30px -15px rgba(15, 23, 42, 0.5);
      width: 100%;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
    }

    p {
      margin: 0;
      color: #475569;
    }

    form,
    .ingredient-rows {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    .ingredients {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .ingredient-group {
      background: #f8fafc;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      width: 100%;
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .group-label {
      margin: 0;
      font-weight: 600;
    }

    .group-total {
      margin: 0.15rem 0 0;
      color: #64748b;
      font-size: 0.88rem;
    }

    .share-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .ingredient-row {
      display: grid;
      grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) auto;
      gap: 0.4rem;
      align-items: center;
      width: 100%;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      min-width: 0;
      padding: 0.65rem 0.7rem;
      border-radius: 10px;
      border: 1px solid #cbd5f5;
      font-size: 16px; /* Prevents auto-zoom on iOS Safari */
      background: #ffffff;
      color: #0f172a;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
      -webkit-appearance: none;
      appearance: none;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: #6366f1;
      outline: none;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 0.85rem;
      width: 100%;
    }

    .grid.single {
      grid-template-columns: minmax(0, 1fr);
    }

    label.field {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-weight: 600;
      min-width: 0;
    }

    .hint {
      font-weight: 400;
      font-size: 0.85rem;
      color: #64748b;
      word-break: break-word;
    }

    .ghost-button,
    .remove-row {
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      flex-shrink: 0;
    }

    .ghost-button {
      border: 1px dashed #94a3b8;
      padding: 0.4rem 0.9rem;
      background: transparent;
      color: #475569;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .ghost-button:hover {
      border-color: #475569;
      color: #0f172a;
    }

    .remove-row {
      padding: 0.55rem 0.75rem;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .results h2 {
      margin: 0;
      font-size: 1.3rem;
    }

    dl {
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.75rem 1rem;
      width: 100%;
    }

    dt {
      font-weight: 600;
      font-size: 0.95rem;
      color: #475569;
    }

    dd {
      margin: 0.15rem 0 0;
      font-size: 1.25rem;
      color: #0f172a;
      font-weight: 700;
    }

    /* iPhone / 移动端针对性响应式优化 */
    @media (max-width: 640px) {
      body {
        padding: max(1rem, env(safe-area-inset-top)) max(0.65rem, env(safe-area-inset-right)) max(1.5rem, env(safe-area-inset-bottom)) max(0.65rem, env(safe-area-inset-left));
      }

      .card {
        padding: 1.1rem 0.9rem;
        border-radius: 14px;
      }

      .ingredient-group {
        padding: 0.75rem;
        border-radius: 12px;
      }

      .ingredient-row {
        grid-template-columns: minmax(0, 1.25fr) minmax(0, 0.95fr) auto;
        gap: 0.35rem;
      }

      input[type="text"],
      input[type="number"] {
        padding: 0.55rem 0.6rem;
      }

      .remove-row {
        padding: 0.55rem 0.6rem;
        font-size: 0.8rem;
      }

      .ghost-button {
        padding: 0.35rem 0.7rem;
        font-size: 0.82rem;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem;
      }

      .grid.single {
        grid-template-columns: minmax(0, 1fr);
      }

      dl {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.65rem 0.85rem;
      }

      dd {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';

    const template = `
      <main class="container">
        <nav class="nav-tabs" role="tablist">
          <button
            type="button"
            role="tab"
            :aria-selected="currentTab === 'dumpling'"
            :class="['nav-tab', { active: currentTab === 'dumpling' }]"
            @click="switchTab('dumpling')"
          >
            🥟 饺子馅调味
          </button>
          <button
            type="button"
            role="tab"
            :aria-selected="currentTab === 'salad'"
            :class="['nav-tab', { active: currentTab === 'salad' }]"
            @click="switchTab('salad')"
          >
            🥗 中国凉菜拌法
          </button>
        </nav>

        <header>
          <h1>{{ currentTab === 'dumpling' ? '饺子馅调味计算器' : '中国凉菜调味计算器' }}</h1>
          <p v-if="currentTab === 'dumpling'">根据肉类与配菜分别称重，科学计算水、油及调味料比例。</p>
          <p v-else>根据凉菜食材总克数与目标含盐率，科学计算各调料所需克数。</p>
        </header>

        <!-- 饺子馅计算器（食材分别称重） -->
        <template v-if="currentTab === 'dumpling'">
          <section class="card">
            <form @submit.prevent>
              <div class="ingredients">
                <ingredient-group
                  label="肉类食材"
                  :total-text="formatWeight(meatTotal)"
                  add-label="+ 添加肉类"
                  :items="groups.meat"
                  @add="addIngredient('meat')"
                  @remove="removeIngredient('meat', $event)"
                ></ingredient-group>

                <ingredient-group
                  label="其他食材"
                  :total-text="formatWeight(otherTotal)"
                  add-label="+ 添加食材"
                  :items="groups.other"
                  @add="addIngredient('other')"
                  @remove="removeIngredient('other', $event)"
                ></ingredient-group>
              </div>

              <p class="hint">请按食材逐项输入，系统会自动汇总总重量。</p>

              <div class="grid single">
                <label class="field">
                  <span>总体含盐率（%）</span>
                  <input type="number" v-model.number="saltRatio" min="0" step="0.1" placeholder="默认 1.5" />
                  <span class="hint">默认值：1.5%</span>
                </label>
              </div>

              <div class="grid">
                <seasoning-input
                  label="可选：酱油重量（克）"
                  v-model="overrideInputs.soyWeight"
                  :suggestion="formatSuggestion(result.defaults.soyWeight)"
                ></seasoning-input>

                <seasoning-input
                  label="可选：蚝油重量（克）"
                  v-model="overrideInputs.oysterWeight"
                  :suggestion="formatSuggestion(result.defaults.oysterWeight)"
                ></seasoning-input>

                <seasoning-input
                  label="可选：味精重量（克）"
                  v-model="overrideInputs.msgWeight"
                  :suggestion="formatSuggestion(result.defaults.msgWeight)"
                ></seasoning-input>

                <seasoning-input
                  label="可选：食盐重量（克）"
                  v-model="overrideInputs.saltWeight"
                  :suggestion="formatSuggestion(result.defaults.saltWeight)"
                ></seasoning-input>
              </div>
            </form>
          </section>

          <section class="card results">
            <div class="group-header">
              <h2>计算结果</h2>
              <div class="share-actions">
                <button type="button" class="ghost-button" @click="copyShareLink">复制配方链接</button>
                <span class="hint" v-if="shareMessage">{{ shareMessage }}</span>
              </div>
            </div>
            <p class="muted" v-if="!ready">请输入肉类或食材重量，调料添加量会自动刷新。</p>
            <div v-else>
              <dl>
                <div>
                  <dt>需加清水</dt>
                  <dd><span>{{ formatWeight(result.waterWeight) }}</span> 克</dd>
                </div>
                <div>
                  <dt>需加食用油</dt>
                  <dd><span>{{ formatWeight(result.oilWeight) }}</span> 克</dd>
                </div>
                <div>
                  <dt>酱油</dt>
                  <dd><span>{{ formatWeight(result.soyWeight) }}</span> 克</dd>
                </div>
                <div>
                  <dt>蚝油</dt>
                  <dd><span>{{ formatWeight(result.oysterWeight) }}</span> 克</dd>
                </div>
                <div>
                  <dt>味精</dt>
                  <dd><span>{{ formatWeight(result.msgWeight) }}</span> 克</dd>
                </div>
                <div>
                  <dt>食盐</dt>
                  <dd><span>{{ formatWeight(result.saltWeight) }}</span> 克</dd>
                </div>
              </dl>
            </div>
          </section>
        </template>

        <!-- 中国凉菜拌法计算器（一起称重，直接给克数） -->
        <template v-else>
          <section class="card">
            <form @submit.prevent>
              <div class="grid single">
                <label class="field">
                  <span>凉菜食材总重（克）</span>
                  <input type="number" v-model.number="saladWeight" min="0" step="1" placeholder="如：500" />
                  <span class="hint">各类食材控水后总克数（一起称重）</span>
                </label>

                <label class="field">
                  <span>目标含盐率（%）</span>
                  <input type="number" v-model.number="saladSaltRatio" min="0" step="0.1" placeholder="默认 1.0" />
                  <span class="hint">默认值：1.0%</span>
                </label>
              </div>

              <p class="hint">💡 注：如果想要加上麻酱，那不要醋，要加入不少蒜。</p>
            </form>
          </section>

          <section class="card results">
            <div class="group-header">
              <h2>计算结果</h2>
              <div class="share-actions">
                <button type="button" class="ghost-button" @click="copyShareLink">复制配方链接</button>
                <span class="hint" v-if="shareMessage">{{ shareMessage }}</span>
              </div>
            </div>
            <p class="muted" v-if="!saladReady">请输入食材总重（克），系统将自动算出各调料所需克数。</p>
            <div v-else>
              <dl>
                <div v-for="item in saladResult.items" :key="item.key">
                  <dt>{{ item.name }}</dt>
                  <dd><span>{{ formatDecimal(item.weight) }}</span> 克</dd>
                </div>
              </dl>
            </div>
          </section>
        </template>
      </main>
    `;

    const DEFAULT_SALT_RATIO = 1.5;
    const DEFAULT_SALAD_SALT_RATIO = 1.0;

    const toNumber = (value) => {
      if (value === '' || value === null || value === undefined) return null;
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed : null;
    };

    const cloneList = (list) => list.map((item) => ({ ...item }));

    const createDefaultState = () => ({
      saltRatio: DEFAULT_SALT_RATIO,
      groups: {
        meat: [
          { name: '牛肉', weight: '' },
          { name: '虾仁', weight: '' },
        ],
        other: [
          { name: '蔬菜', weight: '' },
        ],
      },
      overrideInputs: {
        soyWeight: '',
        oysterWeight: '',
        msgWeight: '',
        saltWeight: '',
      },
    });

    const parseListFromParams = (values, fallback) => {
      if (!values || values.length === 0) return cloneList(fallback);
      if (values.length === 1 && values[0] === '') return [];
      return values.map((entry) => {
        const [name = '', weight = ''] = entry.split('|');
        return { name, weight };
      });
    };

    const getInitialState = () => {
      const fallback = createDefaultState();
      const params = new URLSearchParams(window.location.search);
      const tabParam = params.get('tab');

      const currentTab = (tabParam === 'salad' || params.has('saladWeight') || params.has('saladSaltRatio'))
        ? 'salad'
        : 'dumpling';

      const saltRatioParam = toNumber(params.get('saltRatio'));
      const saladSaltRatioParam = toNumber(params.get('saladSaltRatio'));
      const saladWeightParam = toNumber(params.get('saladWeight'));

      const soy = params.get('soyWeight');
      const oyster = params.get('oysterWeight');
      const msg = params.get('msgWeight');
      const salt = params.get('saltWeight');

      return {
        currentTab,
        saltRatio: saltRatioParam ?? fallback.saltRatio,
        groups: {
          meat: parseListFromParams(params.getAll('meat'), fallback.groups.meat),
          other: parseListFromParams(params.getAll('other'), fallback.groups.other),
        },
        overrideInputs: {
          soyWeight: soy ?? '',
          oysterWeight: oyster ?? '',
          msgWeight: msg ?? '',
          saltWeight: salt ?? '',
        },
        saladWeight: saladWeightParam ?? '',
        saladSaltRatio: saladSaltRatioParam ?? DEFAULT_SALAD_SALT_RATIO,
      };
    };

    function computeDumpling(meatWeight, otherWeight, saltRatio, overrides) {
      const meat = meatWeight ?? 0;
      const other = otherWeight ?? 0;
      const ratio = saltRatio ?? DEFAULT_SALT_RATIO;

      const waterWeight = meat * 0.4;
      const oilWeight = (meat + waterWeight + other) * 0.02;
      const totalWeight = meat + waterWeight + other + oilWeight;
      const totalSodium = totalWeight * ratio / 100 * 23 / 59;

      const soyDefault = totalWeight * 0.02;
      const oysterDefault = totalWeight * 0.02;
      const msgDefault = totalWeight * 0.005;

      const soyWeight = overrides.soyWeight ?? soyDefault;
      const oysterWeight = overrides.oysterWeight ?? oysterDefault;
      const msgWeight = overrides.msgWeight ?? msgDefault;

      const saltDefault = (totalSodium - soyWeight * 0.06 - oysterWeight * 0.045 - msgWeight * 0.12) / 0.39;
      const saltWeight = overrides.saltWeight ?? saltDefault;

      return {
        waterWeight,
        oilWeight,
        soyWeight,
        oysterWeight,
        msgWeight,
        saltWeight,
        defaults: {
          soyWeight: soyDefault,
          oysterWeight: oysterDefault,
          msgWeight: msgDefault,
          saltWeight: saltDefault,
        },
      };
    }

    function computeSalad(ingredientWeight, saltRatio) {
      const totalIngredient = ingredientWeight ?? 0;
      const ratio = (saltRatio ?? DEFAULT_SALAD_SALT_RATIO) / 100.0;

      // 按照 salad.py 计算：
      // recipe: 酱油: 24, 辣椒油: 16, 蚝油: 12, 白糖: 12, 盐: 2, 味精: 2
      // sodium: 酱油: 0.06, 蚝油: 0.045, 盐: 0.39, 味精: 0.12
      // total_sodium = 24*0.06 + 12*0.045 + 2*0.39 + 2*0.12 = 3.00
      // pct = total_ingredient * salt_target * 0.39 / total_sodium
      const recipeDefinitions = [
        { key: 'soy', name: '酱油', parts: 24, sodium: 0.06 },
        { key: 'chiliOil', name: '辣椒油', parts: 16, sodium: 0 },
        { key: 'oyster', name: '蚝油', parts: 12, sodium: 0.045 },
        { key: 'sugar', name: '白糖', parts: 12, sodium: 0 },
        { key: 'salt', name: '食盐', parts: 2, sodium: 0.39 },
        { key: 'msg', name: '味精', parts: 2, sodium: 0.12 },
      ];

      const totalSodium = recipeDefinitions.reduce((sum, item) => sum + item.parts * item.sodium, 0); // 3.00
      const pct = (totalIngredient > 0 && totalSodium > 0)
        ? (totalIngredient * ratio * 0.39) / totalSodium
        : 0;

      const items = recipeDefinitions.map((item) => ({
        key: item.key,
        name: item.name,
        parts: item.parts,
        weight: item.parts * pct,
      }));

      const totalSeasoning = items.reduce((sum, item) => sum + item.weight, 0);

      return {
        pct,
        items,
        totalSeasoning,
      };
    }

    const initialState = getInitialState();

    const app = createApp({
      template,
      data() {
        return {
          currentTab: initialState.currentTab,
          saltRatio: initialState.saltRatio,
          groups: initialState.groups,
          overrideInputs: initialState.overrideInputs,
          saladWeight: initialState.saladWeight,
          saladSaltRatio: initialState.saladSaltRatio,
          shareUrl: window.location.href,
          shareMessage: '',
          shareMessageTimeout: null,
        };
      },
      computed: {
        meatTotal() {
          return this.groups.meat.reduce((sum, item) => sum + (toNumber(item.weight) ?? 0), 0);
        },
        otherTotal() {
          return this.groups.other.reduce((sum, item) => sum + (toNumber(item.weight) ?? 0), 0);
        },
        overridesParsed() {
          return {
            soyWeight: toNumber(this.overrideInputs.soyWeight),
            oysterWeight: toNumber(this.overrideInputs.oysterWeight),
            msgWeight: toNumber(this.overrideInputs.msgWeight),
            saltWeight: toNumber(this.overrideInputs.saltWeight),
          };
        },
        result() {
          return computeDumpling(this.meatTotal, this.otherTotal, this.saltRatio ?? DEFAULT_SALT_RATIO, this.overridesParsed);
        },
        ready() {
          return this.meatTotal > 0;
        },
        saladTotal() {
          return toNumber(this.saladWeight) ?? 0;
        },
        saladResult() {
          return computeSalad(this.saladTotal, this.saladSaltRatio ?? DEFAULT_SALAD_SALT_RATIO);
        },
        saladReady() {
          return this.saladTotal > 0;
        },
      },
      methods: {
        switchTab(tab) {
          this.currentTab = tab;
          document.title = tab === 'dumpling' ? '饺子馅调味计算器' : '中国凉菜调味计算器';
          this.updateShareState();
        },
        addIngredient(group) {
          this.groups[group].push({ name: '', weight: '' });
        },
        removeIngredient(group, index) {
          this.groups[group].splice(index, 1);
        },
        formatWeight(value) {
          return Number.isFinite(value) ? value.toFixed(1) : '0.0';
        },
        formatDecimal(value) {
          return Number.isFinite(value) ? value.toFixed(2) : '0.00';
        },
        formatSuggestion(value) {
          return Number.isFinite(value) ? value.toFixed(1) : '—';
        },
        updateShareState() {
          const url = new URL(window.location.href);
          const params = new URLSearchParams();

          params.set('tab', this.currentTab);

          if (this.currentTab === 'dumpling') {
            const setListParams = (key, list) => {
              if (list.length === 0) {
                params.append(key, '');
                return;
              }
              list.forEach((item) => {
                const name = item.name || '';
                const weight = item.weight ?? '';
                params.append(key, `${name}|${weight}`);
              });
            };

            params.set('saltRatio', typeof this.saltRatio === 'number' ? this.saltRatio : DEFAULT_SALT_RATIO);
            setListParams('meat', this.groups.meat);
            setListParams('other', this.groups.other);
            Object.entries(this.overrideInputs).forEach(([key, value]) => {
              if (value !== '' && value !== null && value !== undefined) {
                params.set(key, value);
              }
            });
          } else {
            if (this.saladWeight !== '' && this.saladWeight !== null) {
              params.set('saladWeight', this.saladWeight);
            }
            params.set('saladSaltRatio', typeof this.saladSaltRatio === 'number' ? this.saladSaltRatio : DEFAULT_SALAD_SALT_RATIO);
          }

          url.search = params.toString();
          window.history.replaceState({}, '', url);
          this.shareUrl = url.toString();
        },
        setShareMessage(message) {
          this.shareMessage = message;
          if (this.shareMessageTimeout) {
            clearTimeout(this.shareMessageTimeout);
          }
          if (message) {
            this.shareMessageTimeout = setTimeout(() => {
              this.shareMessage = '';
            }, 2000);
          }
        },
        copyShareLink() {
          const url = this.shareUrl || window.location.href;
          if (navigator.clipboard?.writeText) {
            navigator.clipboard
              .writeText(url)
              .then(() => this.setShareMessage('已复制链接'))
              .catch(() => this.setShareMessage('复制失败，请手动复制'));
            return;
          }
          const textarea = document.createElement('textarea');
          textarea.value = url;
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          try {
            document.execCommand('copy');
            this.setShareMessage('已复制链接');
          } catch {
            this.setShareMessage('复制失败，请手动复制');
          }
          document.body.removeChild(textarea);
        },
      },
      watch: {
        saltRatio: 'updateShareState',
        groups: {
          handler: 'updateShareState',
          deep: true,
        },
        overrideInputs: {
          handler: 'updateShareState',
          deep: true,
        },
        saladWeight: 'updateShareState',
        saladSaltRatio: 'updateShareState',
      },
      mounted() {
        document.title = this.currentTab === 'dumpling' ? '饺子馅调味计算器' : '中国凉菜调味计算器';
        this.updateShareState();
      },
    });

    app.component('ingredient-group', {
      props: {
        label: {
          type: String,
          required: true,
        },
        totalText: {
          type: String,
          required: true,
        },
        addLabel: {
          type: String,
          required: true,
        },
        items: {
          type: Array,
          default: () => [],
        },
      },
      emits: ['add', 'remove'],
      template: `
        <div class="ingredient-group">
          <div class="group-header">
            <div>
              <p class="group-label">{{ label }}</p>
              <p class="group-total">总量：<span>{{ totalText }}</span> 克</p>
            </div>
            <button type="button" class="ghost-button" @click="$emit('add')">{{ addLabel }}</button>
          </div>
          <div class="ingredient-rows">
            <div class="ingredient-row" v-for="(item, index) in items" :key="index">
              <input type="text" v-model="item.name" placeholder="食材名称" />
              <input type="number" v-model="item.weight" min="0" step="1" placeholder="重量（克）" />
              <button type="button" class="remove-row" @click="$emit('remove', index)">移除</button>
            </div>
          </div>
        </div>
      `,
    });

    app.component('seasoning-input', {
      props: {
        label: {
          type: String,
          required: true,
        },
        modelValue: {
          type: [String, Number],
          default: '',
        },
        suggestion: {
          type: String,
          default: '—',
        },
        placeholder: {
          type: String,
          default: '自动计算',
        },
      },
      emits: ['update:modelValue'],
      methods: {
        updateValue(event) {
          this.$emit('update:modelValue', event.target.value);
        },
      },
      template: `
        <label class="field">
          <span>{{ label }}</span>
          <input
            type="number"
            :value="modelValue"
            min="0"
            step="1"
            :placeholder="placeholder"
            @input="updateValue"
          />
          <span class="hint">建议：<span>{{ suggestion }}</span> 克</span>
        </label>
      `,
    });

    app.mount('#app');
  </script>
</body>
</html>
